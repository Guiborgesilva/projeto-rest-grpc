services:
  postgres:
    image: postgres:17-alpine
    container_name: restaurante-postgres
    environment:
      POSTGRES_DB: restaurante
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurante"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurante-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=restaurante;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "5000:5000"

volumes:
  postgres_data:
